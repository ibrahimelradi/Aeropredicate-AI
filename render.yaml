services:
  - type: web
    name: aeropredict-ai
    runtime: python
    build:
      dockerfilePath: Dockerfile
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PORT
        value: "5000"
      - key: RENDER
        value: "true"
      - key: PYTHONPATH
        value: "/app"
    autoDeploy: true
    plan: free
    healthCheckPath: /