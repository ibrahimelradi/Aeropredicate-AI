services:
  - type: web
    name: aeropredict-ai
    env: docker
    dockerfilePath: Dockerfile
    build:
      dockerfilePath: Dockerfile
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHONPATH
        value: "/app"
      - key: BUILD_TRIGGER
        value: "rebuild-v2-20261018-2350"
      - key: PORT
        value: "5000"
    autoDeploy: true
    plan: free
    healthCheckPath: /
