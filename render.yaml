services:
  - type: web
    name: aeropredict-ai
    env: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHONPATH
        value: "/app"
      - key: BUILD_TRIGGER
        value: "concierge-v6-20261018-2000"
      - key: PORT
        value: "5000"
    autoDeploy: false
    plan: free
    healthCheckPath: /