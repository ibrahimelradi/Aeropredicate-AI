services:
  - type: web
    name: aeropredict-ai
    runtime: python
    build:
      buildCommand: pip install -r backend/requirements.txt
      dockerfilePath: backend/Dockerfile
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PORT
        value: 5000
    autoDeploy: true
    plan: free
    healthCheckPath: /api/model/status
