services:
  - type: web
    name: aeropredict-ai
    runtime: python
    build:
      buildCommand: |
        pip install -r requirements.txt && \
        cd backend && \
        pip install -r requirements.txt && \
        python -c "import sys; sys.path.insert(0, '.'); import app; print('✅ Module import successful')"
      dockerfilePath: Dockerfile
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PORT
        value: "5000"
      - key: RENDER
        value: "true"
      - key: PYTHONPATH
        value: "/app"
    autoDeploy: true
    plan: free
    healthCheckPath: /