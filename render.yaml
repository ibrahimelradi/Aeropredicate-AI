services:
  - type: web
    name: aeropredict-ai
    env: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHONPATH
        value: "/app"
      - key: BUILD_TRIGGER
        value: "rebuild-v1-$(date +%s)"
      - key: PORT
        value: "5000"
    autoDeploy: true
    plan: free
    healthCheckPath: /
