services:
  - type: web
    name: aeropredict-ai
    runtime: python
    build:
      dockerfilePath: Dockerfile
      buildCommand: "echo 'Building with Dockerfile only' && docker --version 2>/dev/null; true"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PORT
        value: "5000"
      - key: RENDER
        value: "true"
      - key: PYTHONPATH
        value: "/app"
      - key: BUILD_TRIGGER
        value: "concierge-v2-20261018-1600"
    autoDeploy: true
    plan: free
    healthCheckPath: /
    disk:
      name: data
      mountPath: /opt/render/data