name: Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  render-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        run: |
          cd backend
          python -c "import sys; sys.path.insert(0, '.'); import app; print('✅ Import successful')"

      - name: Trigger Render Deploy
        run: |
          echo "✅ Build successful - Render will auto-deploy from GitHub integration"
          echo "If auto-deploy is not working, manually deploy on https://dashboard.render.com"
