name: Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build and Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        run: |
          cd backend
          python -c "import sys; sys.path.insert(0, '.'); import app; print('✅ Import successful')"

      - name: Trigger Render Deploy
        run: |
          # If RENDER_DEPLOY_HOOK_URL is set, trigger deploy via webhook
          if [ ! -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -X POST $RENDER_DEPLOY_HOOK_URL
            echo "✅ Triggered deploy via webhook"
          else
            echo "⚠️ No RENDER_DEPLOY_HOOK_URL set - Render should auto-deploy via git integration"
          fi
