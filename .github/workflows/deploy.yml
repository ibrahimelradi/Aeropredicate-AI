name: Deploy to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run build verification tests
        run: |
          cd backend
          python -c "
          import sys
          sys.path.insert(0, '.')
          from app import create_app
          from app.services.ml_engine_enhanced import predict_with_live_data
          from app.services.turnaround_optimizer import optimize_turnaround
          from app.services.gse_optimizer import get_fleet_status
          app = create_app()
          routes = len([r for r in app.url_map.iter_rules()])
          print(f'✅ Build successful: {routes} routes registered')
          assert routes >= 15, 'Not enough routes registered'
          "

      - name: Trigger Render Deploy
        run: |
          echo "✅ Build complete - Render will auto-deploy from GitHub integration"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"

      - name: Log deployment status
        run: |
          echo "Deployment triggered from GitHub Actions"
          echo "Render will auto-deploy the commit to main branch"
