name: Deploy to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy requirements to root if needed
        run: |
          if [ ! -f backend/requirements.txt ] && [ -f requirements.txt ]; then
            cp requirements.txt backend/requirements.txt
          fi

      - name: Deploy to Render
        uses: render-deploy-actions@v1
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          wait-for-success: true